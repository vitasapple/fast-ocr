<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>大梨OCR PRO - PDF 文档识别</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --bg-app: #f4f6fb;
      --bg-sidebar: #ffffff;
      --bg-card: #ffffff;
      --border-color: #e5e9f0;
      --border-hover: #cbd5e1;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent-purple: #8b5cf6;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --btn-bg: #ffffff;
      --input-bg: #ffffff;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"], @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-app: #121316;
        --bg-sidebar: #181a1f;
        --bg-card: #1f222a;
        --border-color: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.16);
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --primary-light: rgba(59, 130, 246, 0.15);
        --accent-purple: #a78bfa;
        --accent-glow: rgba(59, 130, 246, 0.25);
        --btn-bg: #272a34;
        --input-bg: #18191f;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      font-size: 14px;
    }

    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .app-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      user-select: none;
      z-index: 100;
    }

    .sidebar-brand {
      padding: 20px 18px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.35);
      flex-shrink: 0;
    }

    .brand-info {
      flex: 1;
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-nav {
      flex: 1;
      padding: 14px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      transition: all 0.18s ease;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-primary);
    }
    [data-theme="dark"] .nav-item:hover, @media (prefers-color-scheme: dark) {
      .nav-item:hover { background: rgba(255, 255, 255, 0.04); }
    }

    .nav-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      border-color: rgba(37, 99, 235, 0.15);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 10px;
      bottom: 10px;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
      background: var(--primary);
    }

    .nav-icon {
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .nav-meta {
      flex: 1;
      min-width: 0;
    }

    .nav-title {
      font-size: 13px;
      line-height: 1.3;
    }

    .nav-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-item.active .nav-desc {
      color: var(--primary);
      opacity: 0.75;
    }

    .nav-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
    }

    .sidebar-footer {
      padding: 14px 14px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .engine-status-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border-color);
    }

    .engine-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .engine-dot.ready {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .app-main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px 32px;
    }

    .tab-view {
      max-width: 1000px;
      margin: 0 auto;
    }

    .view-header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .view-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
      color: var(--text-primary);
    }

    .view-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.5;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button, select {
      font-family: inherit;
      font-size: 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--text-primary);
      padding: 7px 12px;
      outline: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
    }

    button:hover:not(:disabled) {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    button.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    button.btn-send-format {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      font-weight: 600;
    }

    button.danger {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }

    button.tab-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: inherit;
      cursor: pointer;
    }

    button.tab-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .view-tabs {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.05);
      padding: 2px;
      border-radius: 8px;
    }
    [data-theme="dark"] .view-tabs { background: rgba(255, 255, 255, 0.06); }

    .dropzone {
      margin-top: 12px;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-md);
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.01);
    }

    .dropzone-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .text-editor {
      width: 100%;
      min-height: 380px;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }

    progress {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }

    .status-msg {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .app-toast {
      position: fixed;
      bottom: 24px;
      right: 28px;
      padding: 10px 18px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease;
      z-index: 9999;
    }
    .app-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-title-row">
            <span class="brand-name">大梨 OCR</span>
            <span class="brand-badge">PRO</span>
          </div>
          <div class="brand-sub">极速端侧离线高精识别</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html#image" class="nav-item">
          <span class="nav-icon">🖼️</span>
          <div class="nav-meta">
            <div class="nav-title">图片识别</div>
            <div class="nav-desc">单张/批量/截屏识别</div>
          </div>
        </a>

        <a href="pdf.html" class="nav-item active">
          <span class="nav-icon">📑</span>
          <div class="nav-meta">
            <div class="nav-title">PDF 识别</div>

        </a>

        <a href="index.html#format" class="nav-item">

          <div class="nav-meta">

        <div style="display:flex;justify-content:space-between;align-items:center;">

    <main class="app-main">

            <h1 class="view-title">PDF 文档识别</h1>
            <p class="view-desc">支持扫描件与多页 PDF 智能提取，逐页流式边识别边预览，支持随时中断与格式化导出。</p>
          </div>
        </div>

        <div class="card">
          <div class="row" style="margin-bottom: 12px">
            <input type="file" id="fileInput" accept="application/pdf" style="display:none" />
            <button type="button" id="chooseBtn" class="primary">📁 选择 PDF 文档</button>
            <span id="fileInfo" style="font-size:13px;color:var(--text-secondary);">未选择文件</span>

            <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-left:auto;">

              <div class="view-tabs" id="txtOptionsGroup">

  <div class="app-toast" id="appToast">已完成操作</div>

  <script type="module">
    const ORT_WASM_PATHS = "/npm2/onnxruntime-web@1.26.0/dist/";
    const PDFJS_LIB = "/vendor/pdf.mjs";
    const PDFJS_WORKER = "/vendor/pdf.worker.mjs";

    const $ = (id) => document.getElementById(id);

    function showToast(msg) {
      const t = $("appToast");
      if (!t) return;
      t.textContent = msg;
      t.className = "app-toast show";
      setTimeout(() => { t.className = "app-toast"; }, 2500);
    }

    const ui = {
      fileInput: $("fileInput"),
      chooseBtn: $("chooseBtn"),
      modelSelect: $("modelSelect"),
      runBtn: $("runBtn"),
      stopBtn: $("stopBtn"),
      dropzone: $("dropzone"),
      dropHint: $("dropHint"),
      fileInfo: $("fileInfo"),
      progress: $("progress"),
      status: $("status"),
      fmtTxtBtn: $("fmtTxtBtn"),
      fmtMdBtn: $("fmtMdBtn"),
      txtOptionsGroup: $("txtOptionsGroup"),
      fmtSmartBtn: $("fmtSmartBtn"),
      fmtRawBtn: $("fmtRawBtn"),
      cleanSpacesCheck: $("cleanSpacesCheck"),
      result: $("result"),
      copyBtn: $("copyBtn"),
      downloadBtn: $("downloadBtn"),
      clearBtn: $("clearBtn"),
      sendToFormatBtn: $("sendToFormatBtn")
    };

    const state = {
      ocr: null,
      ocrReady: false,
      pdfFile: null,
      pages: [],
      lastText: "",
      isRunning: false,
      isAborted: false,
      docFormat: "txt",
      formatMode: "smart",
      cleanSpaces: true
    };

    let pdfjsLib = null;

    function setStatus(text, type = "") {
      ui.status.textContent = text;
      ui.status.className = "status-msg " + type;
    }
    function setError(e) {
      console.error(e);
      setStatus("出错了：" + (e instanceof Error ? e.message : String(e)), "error");
    }

    function getModelNames(preset) {
      if (preset === "PP-OCRv5") return { det: "PP-OCRv5_mobile_det", rec: "PP-OCRv5_mobile_rec" };
      return { det: preset + "_det", rec: preset + "_rec" };
    }

    async function loadSdk() {
      const mod = await import("/npm2/@paddleocr/paddleocr-js@0.4.2/+esm");
      if (mod.PaddleOCR) return mod.PaddleOCR;
      throw new Error("OCR 核心模块加载失败");
    }

    async function getPdfjs() {
      if (pdfjsLib) return pdfjsLib;
      pdfjsLib = await import(PDFJS_LIB);
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return pdfjsLib;
    }

    async function initializeOcr() {
      state.ocrReady = false;
      ui.runBtn.disabled = true;
      setStatus("正在加载 OCR 引擎与运行库…");

      try {
        const PaddleOCR = await loadSdk();
        setStatus("正在初始化 OCR 引擎（加载本地模型）…");

        const threadCount = self.crossOriginIsolated
          ? Math.min(4, Math.max(1, (navigator.hardwareConcurrency || 2) - 1))
          : 1;

        const { det, rec } = getModelNames(ui.modelSelect.value);
        const ocr = await PaddleOCR.create({
          initialize: false,
          worker: false,
          textDetectionModelName: det,
          textDetectionModelAsset: { url: "/models/" + det + "_onnx_infer.tar" },
          textRecognitionModelName: rec,
          textRecognitionModelAsset: { url: "/models/" + rec + "_onnx_infer.tar" },
          ortOptions: {
            backend: "auto",
            wasmPaths: ORT_WASM_PATHS,
            numThreads: threadCount,
            simd: true
          }
        });

        await ocr.initialize();
        state.ocr = ocr;
        state.ocrReady = true;
        ui.runBtn.disabled = !state.pdfFile;
        setStatus("就绪：选择一个 PDF，然后点击“开始识别整个 PDF”。", "ok");
      } catch (e) {
        setError(e);
      }
    }

    function cleanOcrSpaces(str) {
      if (!str) return "";
      let prev;
      let res = str;
      const hSpace = "[ \t\u00A0\u3000]+";
      const cjk = "[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]";
      const punct = "[，。！？；：、“”‘’（）]";
      const r1 = new RegExp(`(${cjk})${hSpace}(${cjk})`, "g");
      const r2 = new RegExp(`(${cjk})${hSpace}(${punct})`, "g");
      const r3 = new RegExp(`(${punct})${hSpace}(${cjk})`, "g");

      let maxLoops = 25;
      do {
        prev = res;
        res = res.replace(r1, "$1$2").replace(r2, "$1$2").replace(r3, "$1$2");
        maxLoops--;
      } while (res !== prev && maxLoops > 0);

      return res.replace(/[ \t]+/g, " ").replace(/[ \t]+$/gm, "");
    }

    function hasSentenceEnd(str) {
      if (!str) return false;
      const trimmed = str.trim().replace(/['"”’\)）\]】》]+$/, "");
      return /[。？！?!;；…]$/.test(trimmed) || /([。？！?!;；…][’”"'\)）\]】》]*)$/.test(str.trim());
    }

    function formatSmartParagraphs(itemsOrLines, cleanSpaces = true) {
      if (!itemsOrLines || !itemsOrLines.length) return "";
      const isItems = typeof itemsOrLines[0] === "object" && itemsOrLines[0] !== null && "text" in itemsOrLines[0];
      const listRegex = /^(\d+[\.、\)]|\([0-9a-zA-Z一二三四五六七八九十]+\)|[一二三四五六七八九十]+[、\.]|[•\-\*·◆●■]|第[0-9一二三四五六七八九十]+[章节条篇部])/;
      const isCjk = (ch) => /[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch);

      let items = [];
      if (isItems) {
        items = itemsOrLines.map((it) => {
          const text = (it.text || "").trim();
          let left = it.left || 0, right = it.right || 0, top = it.top || 0, bottom = it.bottom || 0, height = it.height || 20;
          if (it.poly && it.poly.length >= 4) {
            left = Math.min(it.poly[0][0], it.poly[3][0]);
            right = Math.max(it.poly[1][0], it.poly[2][0]);
            top = Math.min(it.poly[0][1], it.poly[1][1]);
            bottom = Math.max(it.poly[2][1], it.poly[3][1]);
            height = Math.max(10, bottom - top);
          }
          return { text, left, right, top, bottom, height };
        }).filter((it) => it.text.length > 0);
      } else {
        items = itemsOrLines
          .map((line) => ({ text: String(line).trim(), left: 0, right: 0, top: 0, bottom: 0, height: 20 }))
          .filter((it) => it.text.length > 0);
      }

      if (!items.length) return "";

      const heights = items.map((it) => it.height).sort((a, b) => a - b);
      const avgHeight = heights[Math.floor(heights.length / 2)] || 20;
      const maxRight = Math.max(...items.map((it) => it.right));
      const minLeft = Math.min(...items.map((it) => it.left));
      const hasGeometry = isItems && items.some((it) => it.right > 0);

      let gaps = [];
      if (hasGeometry) {
        for (let i = 1; i < items.length; i++) {
          const g = items[i].top - items[i - 1].bottom;
          if (g >= 0 && g < avgHeight * 4) gaps.push(g);
        }
      }
      gaps.sort((a, b) => a - b);
      const medianGap = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 8;

      const paragraphs = [];
      let currentPara = "";

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const lineText = item.text;

        if (!currentPara) {
          currentPara = lineText;
          continue;
        }

        const prevItem = items[i - 1];
        const isCurrentEnd = hasSentenceEnd(currentPara);
        const isNextList = listRegex.test(lineText);
        const isNextHeading = (item.height / avgHeight >= 1.35 && lineText.length <= 40) || /^第[0-9一二三四五六七八九十百千万]+[章节篇卷部]/.test(lineText);

        let isNewParagraph = false;

        if (isNextList || isNextHeading) {
          isNewParagraph = true;
        } else if (hasGeometry) {
          const vertGap = item.top - prevItem.bottom;
          const isMassiveGap = vertGap > Math.max(avgHeight * 2.2, medianGap * 2.8);
          const isIndented = (item.left - minLeft) > avgHeight * 1.3;
          const isShortLine = (maxRight - prevItem.right) > avgHeight * 2.0;

          if (isMassiveGap) {
            isNewParagraph = true;
          } else if (isCurrentEnd && (isShortLine || isIndented || vertGap > medianGap * 1.6)) {
            isNewParagraph = true;
          }
        } else {
          if (isCurrentEnd) {
            isNewParagraph = true;
          }
        }

        if (isNewParagraph) {
          paragraphs.push(currentPara);
          currentPara = lineText;
        } else {
          const lastChar = currentPara.slice(-1);
          const firstChar = lineText.charAt(0);
          if (lastChar === "-" && /[a-zA-Z]/.test(currentPara.slice(-2, -1)) && /[a-zA-Z]/.test(firstChar)) {
            currentPara = currentPara.slice(0, -1) + lineText;
          } else if (isCjk(lastChar) || isCjk(firstChar)) {
            currentPara += lineText;
          } else {
            currentPara += " " + lineText;
          }
        }
      }

      if (currentPara) paragraphs.push(currentPara);

      let result = paragraphs.join("\n\n");
      if (cleanSpaces) result = cleanOcrSpaces(result);
      return result;
    }

    function formatMarkdown(itemsOrLines, cleanSpaces = true) {
      if (!itemsOrLines || !itemsOrLines.length) return "";
      const isItems = typeof itemsOrLines[0] === "object" && itemsOrLines[0] !== null && "text" in itemsOrLines[0];

      let items = [];
      if (isItems) {
        items = itemsOrLines.map((it) => {
          const text = (it.text || "").trim();
          let left = 0, right = 0, top = 0, bottom = 0, height = 20;
          if (it.poly && it.poly.length >= 4) {
            left = Math.min(it.poly[0][0], it.poly[3][0]);
            right = Math.max(it.poly[1][0], it.poly[2][0]);
            top = Math.min(it.poly[0][1], it.poly[1][1]);
            bottom = Math.max(it.poly[2][1], it.poly[3][1]);
            height = Math.max(10, bottom - top);
          }
          return { text, left, right, top, bottom, height };
        }).filter((it) => it.text.length > 0);
      } else {
        items = itemsOrLines.map((l) => ({ text: String(l).trim(), left: 0, right: 0, top: 0, bottom: 0, height: 20 })).filter((it) => it.text.length > 0);
      }

      if (!items.length) return "";

      const heights = items.map((it) => it.height).sort((a, b) => a - b);
      const avgHeight = heights[Math.floor(heights.length / 2)] || 20;
      const mdLines = [];

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        let t = item.text;
        if (cleanSpaces) t = cleanOcrSpaces(t);

        const relH = item.height / avgHeight;
        if (relH >= 1.6 && t.length <= 40) {
          mdLines.push(`\n# ${t}\n`);
        } else if (relH >= 1.3 && t.length <= 50) {
          mdLines.push(`\n## ${t}\n`);
        } else if (/^第[0-9一二三四五六七八九十百千万]+[章节篇卷部]/.test(t) && t.length <= 30) {
          mdLines.push(`\n### ${t}\n`);
        } else if (/^(\d+[\.、]|\([0-9]+\))\s*/.test(t)) {
          mdLines.push(t.replace(/^(\d+)[\.、]\s*/, "$1. "));
        } else if (/^[•\-\*·◆●■]\s*/.test(t)) {
          mdLines.push(t.replace(/^[•\-\*·◆●■]\s*/, "- "));
        } else {
          mdLines.push(t);
        }
      }

      const finalBlocks = [];
      let buf = [];
      for (const line of mdLines) {
        if (line.startsWith("\n#") || line.startsWith("- ") || /^\d+\.\s/.test(line)) {
          if (buf.length) {
            finalBlocks.push(formatSmartParagraphs(buf, cleanSpaces));
            buf = [];
          }
          finalBlocks.push(line.trim());
        } else {
          buf.push(line);
        }
      }
      if (buf.length) {
        finalBlocks.push(formatSmartParagraphs(buf, cleanSpaces));
      }

      return finalBlocks.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function renderPdfResult(scrollBottom = false) {
      if (!state.pages.length) {
        state.lastText = "";
        ui.result.value = "";
        ui.copyBtn.disabled = true;
        ui.downloadBtn.disabled = true;
        return;
      }

      const isMd = state.docFormat === "md";
      const pageTexts = state.pages.map((p) => {
        if (isMd) {
          const header = `## 第 ${p.pageNo} 页`;
          const body = formatMarkdown(p.items, state.cleanSpaces);
          return `${header}\n\n${body}`;
        } else {
          const header = `--- 第 ${p.pageNo} 页 ---`;
          const body = state.formatMode === "smart"
            ? formatSmartParagraphs(p.items, state.cleanSpaces)
            : p.items.map((it) => it.text).join("\n");
          return `${header}\n${body}`;
        }
      });

      state.lastText = pageTexts.join(isMd ? "\n\n---\n\n" : "\n\n");
      ui.result.value = state.lastText;
      if (scrollBottom) ui.result.scrollTop = ui.result.scrollHeight;
      ui.copyBtn.disabled = !state.lastText;
      ui.downloadBtn.disabled = !state.lastText;
      ui.downloadBtn.textContent = isMd ? "💾 下载 .md" : "💾 下载 .txt";
    }

    function acceptPdf(file) {
      if (state.isRunning || !file) return;
      state.pdfFile = file;
      state.pages = [];
      state.lastText = "";
      const sizeMb = (file.size / 1048576).toFixed(1);
      ui.fileInfo.textContent = `${file.name} (${sizeMb} MB)`;
      ui.dropHint.style.display = "none";
      ui.runBtn.disabled = !state.ocrReady;
      setStatus("已选择 PDF，点击“开始识别整个 PDF”。", "ok");
    }

    async function recognizePdf() {
      if (!state.ocrReady || !state.ocr || !state.pdfFile || state.isRunning) return;

      state.isRunning = true;
      state.isAborted = false;
      state.pages = [];
      state.lastText = "";
      ui.result.value = "";

      ui.runBtn.style.display = "none";
      ui.stopBtn.style.display = "inline-flex";
      ui.progress.hidden = false;

      let pdf = null;
      try {
        setStatus("正在解析 PDF…");
        const pdfjs = await getPdfjs();
        const data = await state.pdfFile.arrayBuffer();
        pdf = await pdfjs.getDocument({
          data: new Uint8Array(data),
          cMapUrl: "/vendor/cmaps/",
          cMapPacked: true,
          standardFontDataUrl: "/vendor/standard_fonts/"
        }).promise;

        const numPages = pdf.numPages;
        ui.progress.max = numPages;
        ui.progress.value = 0;

        let totalLines = 0;
        let totalMs = 0;

        for (let pageNo = 1; pageNo <= numPages; pageNo++) {
          if (state.isAborted) break;
          setStatus(`正在识别第 ${pageNo} / ${numPages} 页…`);

          const page = await pdf.getPage(pageNo);
          try {
            const viewport = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement("canvas");
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            const ctx = canvas.getContext("2d", { alpha: false });
            await page.render({ canvasContext: ctx, viewport }).promise;

            if (state.isAborted) break;
            const [result] = await state.ocr.predict(canvas, { textRecScoreThresh: 0.1 });
            const items = result.items || [];
            totalLines += items.length;
            totalMs += result.metrics?.totalMs || 0;

            state.pages.push({ pageNo, items });
            renderPdfResult(true);
          } finally {
            try { page.cleanup(); } catch (_) {}
          }
          ui.progress.value = pageNo;
        }

        setStatus(state.isAborted ? "识别已中断。" : `识别完成：共 ${numPages} 页，耗时 ${(totalMs/1000).toFixed(1)} 秒。`, "ok");
      } catch (err) {
        setError(err);
      } finally {
        state.isRunning = false;
        if (pdf && typeof pdf.destroy === "function") try { await pdf.destroy(); } catch (_) {}
        ui.progress.hidden = true;
        ui.runBtn.style.display = "inline-flex";
        ui.stopBtn.style.display = "none";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      ui.chooseBtn.addEventListener("click", () => ui.fileInput.click());
      ui.fileInput.addEventListener("change", (e) => { if (e.target.files?.length) acceptPdf(e.target.files[0]); });

      const dz = ui.dropzone;
      ["dragenter", "dragover"].forEach((evt) => dz.addEventListener(evt, (e) => { e.preventDefault(); }));
      ["dragleave", "drop"].forEach((evt) => dz.addEventListener(evt, (e) => { e.preventDefault(); }));
      dz.addEventListener("drop", (e) => { if (e.dataTransfer?.files?.length) acceptPdf(e.dataTransfer.files[0]); });

      ui.runBtn.addEventListener("click", recognizePdf);
      ui.stopBtn.addEventListener("click", () => { state.isAborted = true; });

      ui.fmtTxtBtn.addEventListener("click", () => {
        state.docFormat = "txt";
        ui.fmtTxtBtn.classList.add("active");
        ui.fmtMdBtn.classList.remove("active");
        ui.txtOptionsGroup.style.display = "inline-flex";
        renderPdfResult();
      });

      ui.fmtMdBtn.addEventListener("click", () => {
        state.docFormat = "md";
        ui.fmtMdBtn.classList.add("active");
        ui.fmtTxtBtn.classList.remove("active");
        ui.txtOptionsGroup.style.display = "none";
        renderPdfResult();
      });

      ui.fmtSmartBtn.addEventListener("click", () => {
        state.formatMode = "smart";
        ui.fmtSmartBtn.classList.add("active");
        ui.fmtRawBtn.classList.remove("active");
        renderPdfResult();
      });

      ui.fmtRawBtn.addEventListener("click", () => {
        state.formatMode = "raw";
        ui.fmtRawBtn.classList.add("active");
        ui.fmtSmartBtn.classList.remove("active");
        renderPdfResult();
      });

      ui.cleanSpacesCheck.addEventListener("change", (e) => {
        state.cleanSpaces = e.target.checked;
        renderPdfResult();
      });

      ui.copyBtn.addEventListener("click", async () => {
        if (!state.lastText) return;
        await navigator.clipboard.writeText(state.lastText);
        showToast("已复制全部内容 ✓");
      });

      ui.downloadBtn.addEventListener("click", () => {
        if (!state.lastText) return;
        const ext = state.docFormat === "md" ? "md" : "txt";
        const blob = new Blob([state.lastText], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `PDF_OCR_${Date.now()}.${ext}`;
        a.click();
      });

      ui.clearBtn.addEventListener("click", () => {
        state.file = null;
        state.pages = [];
        state.lastText = "";
        ui.result.value = "";
        ui.fileInfo.textContent = "未选择文件";
        ui.dropHint.style.display = "block";
      });

      ui.sendToFormatBtn.addEventListener("click", () => {
        if (!ui.result.value.trim()) {
          showToast("暂无可发送的识别文本");
          return;
        }
        localStorage.setItem("dali_pending_format_text", ui.result.value);
        window.location.href = "index.html#format";
      });

      ui.modelSelect.addEventListener("change", () => initializeOcr().catch(setError));

      initializeOcr().catch(setError);
    });
  </script>
</body>
