name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows PC (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Windows App (.exe)
        run: npm run tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaddleOCR-Windows-Installer
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PaddleOCR Desktop v1.0.0 (Windows)"
          draft: false
          prerelease: false
          body: |
            ## PaddleOCR.js 离线桌面版 (Windows x64)

            - **无需 Python 环境**：基于原生 Tauri 桌面端与 WebView2，终端电脑无需安装或配置任何 Python 环境。
            - **全本地离线运算**：已内置 6 款高精度与轻量化 ONNX 离线模型，断网也能极速识别。
            - **功能完备**：单图识别、剪贴板一键粘贴识别（Ctrl+V）、PDF 全篇幅逐页 OCR 识别、一键导出与复制。

            ### 📥 下载安装
            直接点击下方 Assets 中的 **`PaddleOCR_1.0.0_x64-setup.exe`**，下载后双击安装即可使用。
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
