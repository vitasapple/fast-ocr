name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows PC (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Windows App (.exe)
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaLiOCR-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon-M
            target: aarch64-apple-darwin
          - name: Intel-x64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri macOS App (.dmg)
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg,app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DaLiOCR-macOS-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish-release:
    name: Publish Clean Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version
        id: app-version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Auto-clean all old releases, assets and previous run records
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ steps.app-version.outputs.tag_name }}
        with:
          script: |
            const currentTag = process.env.TAG_NAME;
            // 1. Delete old releases and their assets
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              for (const rel of releases.data) {
                console.log(`Processing release ${rel.tag_name} (id: ${rel.id})...`);
                for (const asset of rel.assets) {
                  console.log(`Deleting asset: ${asset.name} (id: ${asset.id})`);
                  try {
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  } catch (e) {
                    console.log('Asset delete error:', e.message);
                  }
                }
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: rel.id
                  });
                  console.log(`Deleted release ${rel.tag_name}`);
                } catch (e) {
                  console.log('Release delete error:', e.message);
                }
              }
            } catch (err) {
              console.log('Error listing releases:', err.message);
            }

            // 2. Delete old completed workflow runs
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 50
              });
              for (const r of runs.data.workflow_runs) {
                if (r.id !== context.runId && r.status === 'completed') {
                  console.log(`Deleting old workflow run #${r.run_number} (${r.id})`);
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: r.id
                    });
                  } catch (e) {
                    console.log('Run delete error:', e.message);
                  }
                }
              }
            } catch (err) {
              console.log('Error listing workflow runs:', err.message);
            }

      - name: Publish Fresh Clean Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app-version.outputs.tag_name }}
          name: "Release ${{ steps.app-version.outputs.tag_name }}"
          draft: false
          prerelease: false
          files: |
            release-assets/*.exe
            release-assets/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
