[package]
name = "paddleocr-desktop"
version = "1.0.0"
description = "PaddleOCR.js Desktop Application"
authors = ["PaddleOCR Desktop"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
percent-encoding = "2.3"
