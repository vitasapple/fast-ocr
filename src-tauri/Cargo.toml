[package]
name = "dali-ocr"
version = "1.0.0"
description = "DaLi OCR Desktop Application"
authors = ["DaLi OCR"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
percent-encoding = "2.3"
